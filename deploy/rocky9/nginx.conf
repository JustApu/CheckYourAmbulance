# Check Your Ambulance (issue #6 host profile): main nginx configuration. Port 80 serves only
# ACME HTTP-01 challenges and redirects everything else to HTTPS (SPEC 1.23.0 DEP-10);
# the HTTPS server is in conf.d/cya.conf.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    # No query strings, referrers or cookies in access logs (OAuth codes travel in /auth/callback/?code=).
    log_format cya '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent $request_time "$host"';
    access_log /var/log/nginx/access.log cya;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        location ^~ /.well-known/acme-challenge/ {
            root /var/lib/cya-acme;
            default_type text/plain;
        }
        location / {
            return 301 https://__HOST__$request_uri;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}
