# Check Your Ambulance (issue #6 host profile, phase 2: HTTPS proxy to the uvicorn socket).
upstream cya_app {
    server unix:/run/cya/app.sock;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
limit_req_zone $binary_remote_addr zone=cya_auth:10m rate=30r/m;
limit_req_status 429;

# Unknown host names get no TLS handshake at all.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __HOST__;

    ssl_certificate /etc/letsencrypt/live/cya/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cya/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:cya_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location /auth/ {
        include /etc/nginx/cya_proxy_headers.conf;
        proxy_set_header Connection "";
        limit_req zone=cya_auth burst=30 nodelay;
        # Error-log lines carry the request line, including /auth/callback/?code=...
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://cya_app;
    }

    location /ws/ {
        include /etc/nginx/cya_proxy_headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_pass http://cya_app;
    }

    location / {
        include /etc/nginx/cya_proxy_headers.conf;
        proxy_set_header Connection "";
        proxy_pass http://cya_app;
    }
}
