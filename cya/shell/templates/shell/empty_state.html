{# Issue #194: an empty list says what it means and offers the next step: one action, a hint, or both. #}
<div class="empty-state">
  <p class="empty-state-message">{{ message }}</p>
  {% if hint %}<p class="empty-state-hint">{{ hint }}</p>{% endif %}
  {% if action_url %}<p class="empty-state-action"><a class="button" href="{{ action_url }}">{{ action_label }}</a></p>{% endif %}
</div>
