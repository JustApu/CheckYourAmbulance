{# Theme (issue #238): three compact choices in one group; each radio keeps its own name. #}
<fieldset class="theme-control">
  <legend>Theme</legend>
  <div class="theme-choices">
    <label class="theme-choice"><input type="radio" name="theme" value="auto" checked><span>Auto</span></label>
    <label class="theme-choice"><input type="radio" name="theme" value="light"><span>Light</span></label>
    <label class="theme-choice"><input type="radio" name="theme" value="dark"><span>Dark</span></label>
  </div>
</fieldset>
